          modified: 1789694563003
          sortKey: -1789694069824
          description: ""
        children:
          - url: "{{ _.base_url }}/api/company/{{ _.company_id }}/file-export"
            name: 1 - Request Export (happy path CSV)
            meta:
              id: req_e87e1d9054f44cccb02fa507e602f9ca
              created: 1700000000000
              modified: 1789694180430
              isPrivate: false
              description: Creates an export for domain=CUSTOMER, format=CSV. Expects 202 +
                PENDING state. Stores exportId for the next requests.
              sortKey: -1789694074302
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                  "format": "CSV",
                  "columns": ["id", "name", "email"],
                  "domain": "CUSTOMER",
                  "customerEmail": "customer@example.com"
                }
            headers:
              - name: Content-Type
                value: application/json
            scripts:
              preRequest: >-
                if (!insomnia.environment.get('company_id')) {
                  insomnia.environment.set('company_id', Math.floor(Math.random() * 1000000) + 9000000);
                }
              afterResponse: >-
                const body = insomnia.response.json();


                insomnia.test('status is 202 Accepted', () => {
                  insomnia.expect(insomnia.response.status).to.equal("Accepted");
                });


                insomnia.test('response has PENDING state', () => {
                  insomnia.expect(body.state).to.equal('PENDING');
                });


                insomnia.test('response has an exportId', () => {
                  insomnia.expect(body.exportId).to.be.a('string');
                });


                insomnia.environment.set('export_id', body.exportId);
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/api/company/{{ _.company_id }}/file-export/{{ _.export_id
              }}/download"
            name: 2 - Download Export - COMPLETED (1000 records)
            meta:
              id: req_533de61cc0e14d29aa1499041c33496c
              created: 1789693014502
              modified: 1789694387217
              isPrivate: false
              description: The export from request 1 is still PENDING (nothing in this API
                flips it to COMPLETED - that's done by the separate
                file-processor-worker service). Expects 422.
              sortKey: -1789694074202
            method: GET
            scripts:
              afterResponse: >-
                insomnia.test('status is 200 OK', () => {
                  insomnia.expect(insomnia.response.status).to.equal("OK");
                });


                insomnia.test('content-type is text/csv', () => {
                  const contentType = insomnia.response.headers.get('Content-Type') || '';
                  insomnia.expect(contentType).to.include('text/csv');
                });


                insomnia.test('content-disposition is an export attachment', ()
                => {
                  const disposition = insomnia.response.headers.get('Content-Disposition') || '';
                  insomnia.expect(disposition).to.include('attachment');
                  insomnia.expect(disposition).to.include('export_');
                });


                const csvText = insomnia.response.body.toString();

                const lines = csvText.split(/\r?\n/).filter((line) =>
                line.length > 0);

                const dataRecordCount = lines.length - 1; // minus the header
                row


                insomnia.test('CSV body has 1000 data records', () => {
                  insomnia.expect(dataRecordCount).to.equal(1000);
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
