          - url: "{{ _.base_url }}/api/company/5000/file-import/{{ _.import_id }}/status"
            name: 2 - Get Import Status - COMPLETED (2 Warnings)
            meta:
              id: req_27856968c49549669927220dd84c3f79
              created: 1789692216930
              modified: 1789693764538
              isPrivate: false
              description: Random UUID that was never created. Expects 400.
              sortKey: -1789692061914
            method: GET
            scripts:
              afterResponse: >-
                const body = insomnia.response.json();


                insomnia.test('status is 200 OK', () => {
                  insomnia.expect(insomnia.response.status).to.equal("OK");
                });


                insomnia.test('importId matches the requested id', () => {
                  insomnia.expect(body.importId).to.equal(insomnia.environment.get('import_id'));
                });


                insomnia.test('state is COMPLETED', () => {
                  insomnia.expect(body.state).to.equal('COMPLETED');
                });


                insomnia.test('details contain the blank line warning', () => {
                  const descriptions = (body.details || []).map((d) => d.description);
                  insomnia.expect(descriptions.some((d) => d.includes('Blank line detected at record 3 in file'))).to.equal(true);
                });


                insomnia.test('has 2 records with type WARNING_SKIP', () => {
                  const warningSkipCount = (body.details || []).filter((d) => d.type === 'WARNING_SKIP').length;
                  insomnia.expect(warningSkipCount).to.equal(2);
                });
            settings:
              renderRequestBody: true
