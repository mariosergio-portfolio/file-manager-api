                  preRequest: >-
                    if (!insomnia.environment.get('company_id')) {
                      insomnia.environment.set('company_id', Math.floor(Math.random() * 1000000) + 9000000);
                    }
                  afterResponse: >-
                    const body = insomnia.response.json();


                    insomnia.test('status is 202 Accepted', () => {
                      insomnia.expect(insomnia.response.status).to.equal("Accepted");
                    });


                    insomnia.test('response has PENDING state', () => {
                      insomnia.expect(body.state).to.equal('PENDING');
                    });


                    insomnia.test('response has an exportId', () => {
                      insomnia.expect(body.exportId).to.be.a('string');
                    });


                    insomnia.environment.set('export_id', body.exportId);
                settings:
                  renderRequestBody: true
