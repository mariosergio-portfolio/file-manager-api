          created: 1700000000000
          modified: 1789693731404
          isPrivate: false
          description: domain=PRODUCT is not yet supported by ImportService. Expects 422.
          sortKey: -800
        method: POST
        body:
          mimeType: multipart/form-data
          params:
            - name: file
              value: ""
              description: Pick any local CSV file
              fileName: C:\myfolder\customers_1000_OK.csv
              type: file
            - name: domain
              value: PRODUCT
              description: ""
        scripts:
          afterResponse: >-
            insomnia.test('status is 422 Unprocessable Entity', () => {
              insomnia.expect(insomnia.response.status).to.equal("Unprocessable Entity");
            });


            insomnia.test('error message mentions unsupported domain', () => {
              insomnia.expect(insomnia.response.body.toString()).to.include('Domain not supported');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
