      - name: Happy Path
        meta:
          id: fld_bb30f1ec54c34c9880a8e0885f9390ba
          created: 1789691892289
          modified: 1789694755907
          sortKey: -1789691892289
          description: ""
        children:
          - url: "{{ _.base_url }}/api/company/{{ _.company_id }}/file-import"
            name: 1 - Import CSV (happy path)
            meta:
              id: req_72a6e642bd6d44b3a9c05ea89a09681a
              created: 1700000000000
              modified: 1789694723085
              isPrivate: false
              description: Uploads a CSV for domain=CUSTOMER. Expects 202 + PENDING state.
                Pick a local CSV file for the 'file' field before sending.
                Stores importId for the next requests.
              sortKey: -1789691920456
            method: POST
            body:
              mimeType: multipart/form-data
              params:
                - name: file
                  value: ""
                  description: Pick any local CSV file
                  fileName: C:\myfolder\customers_1000_OK.csv
                  type: file
                - name: domain
                  value: CUSTOMER
                  description: ""
            scripts:
              preRequest: >-
                if (!insomnia.environment.get('company_id')) {
                  insomnia.environment.set('company_id', Math.floor(Math.random() * 1000000) + 9000000);
                }
              afterResponse: >-
                const body = insomnia.response.json();


                insomnia.test('status is 202 Accepted', () => {
                  insomnia.expect(insomnia.response.status).to.equal("Accepted");
                });


                insomnia.test('response has PENDING state', () => {
                  insomnia.expect(body.state).to.equal('PENDING');
                });


                insomnia.test('response has an importId', () => {
                  insomnia.expect(body.importId).to.be.a('string');
                });


                insomnia.environment.set('import_id', body.importId);
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/api/company/{{ _.company_id }}/file-import/{{ _.import_id
              }}/status"
            name: 2 - Get Import Status
            meta:
              id: req_998c601a5df5443d818a086c1bb7d0ab
              created: 1700000000000
              modified: 1789693848954
              isPrivate: false
              description: Polls the status of the import created by request 1.
              sortKey: -1789691920356
            method: GET
            scripts:
              afterResponse: >-
                const body = insomnia.response.json();


                insomnia.test('status is 200 OK', () => {
                  insomnia.expect(insomnia.response.status).to.equal("OK");
                });


                insomnia.test('importId matches the requested id', () => {
                  insomnia.expect(body.importId).to.equal(insomnia.environment.get('import_id'));
                });


                insomnia.test('state is a known ImportState', () => {
                  insomnia.expect(['PENDING', 'PROCESSING', 'COMPLETED', 'ERROR']).to.include(body.state);
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/api/company/{{ _.company_id }}/file-import/{{ _.import_id
              }}/status"
            name: 3 - Get Import Status - COMPLETED (1000 records)
            meta:
              id: req_54813cd4323f40ab85d4d131a8613319
              created: 1789691454322
              modified: 1789693852356
              isPrivate: false
              description: Random UUID that was never created. Expects 400.
              sortKey: -1789691920256
            method: GET
            scripts:
              afterResponse: >-
                const body = insomnia.response.json();


                insomnia.test('status is 200 OK', () => {
                  insomnia.expect(insomnia.response.status).to.equal("OK");
                });


                insomnia.test('importId matches the requested id', () => {
                  insomnia.expect(body.importId).to.equal(insomnia.environment.get('import_id'));
                });


                insomnia.test('state is COMPLETED', () => {
                  insomnia.expect(body.state).to.equal('COMPLETED');
                });


                insomnia.test('all details have type INFO', () => {
                  const types = (body.details || []).map((d) => d.type);
                  insomnia.expect(types.every((type) => type === 'INFO')).to.equal(true);
                });


                insomnia.test('details contain the finished summary message', ()
                => {
                  const descriptions = (body.details || []).map((d) => d.description);
                  insomnia.expect(descriptions).to.include('FINISHED Import file with status COMPLETED. Written=1000, Skipped=0');
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
