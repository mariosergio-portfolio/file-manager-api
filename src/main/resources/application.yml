spring:
  application:
    name: file-manager-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      local: file-system
      dev: aws-s3

  servlet:
    multipart:
      max-file-size: 5MB # default is 1MB
      max-request-size: 10MB # default
  server:
    tomcat:
      max-http-form-post-size: 100MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # is managed by file-processor-worker application
    #flyway:
    #  enabled: true
    #locations: classpath:db/migration
    #base-locations: classpath:db/migration
    #baseline-on-migrate: true
    #baseline-version: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false  # don't loop on bad messages

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


rabbitmq:
  exchange:
    import: import.exchange
    export: export.exchange
  queue:
    import: import.queue
    export: export.queue
  routing-key:
    import: import.routing.key
    export: export.routing.key

server:
  port: 8080

logging:
  level:
    com.planet: DEBUG
